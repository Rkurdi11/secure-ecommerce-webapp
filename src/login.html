<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / التسجيل - متجر الإلكترونيات الآمن</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>متجر الإلكترونيات الآمن</h1>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="dashboard.html">لوحة التحكم</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="auth-section">
            
            <h2>تسجيل الدخول</h2>
            <form id="login-form">
                <div>
                    <label for="username">اسم المستخدم:</label>
                    <input type="text" id="username" required>
                </div>
                
                <div>
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" required>
                </div>
                
                <button type="button" onclick="handleLogin()">دخول آمن</button>
            </form>
            
            <hr>
            
            <h2>تسجيل جديد</h2>
            <form id="register-form">
                <div>
                    <label for="reg-username">اسم المستخدم:</label>
                    <input type="text" id="reg-username" required>
                </div>
                 <div>
                    <label for="reg-password">كلمة المرور:</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div>
                    <label for="phone">رقم الهاتف:</label>
                    <input type="text" id="phone" required placeholder="أدخل أرقاماً فقط">
                </div>
                
                <button type="button" onclick="handleRegistration()">تسجيل</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 متجر الإلكترونيات. جميع الحقوق محفوظة.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
